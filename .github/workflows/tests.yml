name: Source regression checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-cpu:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.6'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install CPU-only dependencies
        shell: pwsh
        run: |
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements-lock.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
      - name: Verify CPU runtime and run tests
        shell: pwsh
        run: |
          python -c "import torch; assert torch.version.cuda is None; print(torch.__version__)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/audit_release.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python fmt.py --version
